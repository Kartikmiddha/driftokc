name: Build DriftDock

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies (ldid & dpkg)
        run: |
          brew install ldid dpkg

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Download iOS SDKs
        run: |
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build Rootless Package (.deb)
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p output_packages
          cp packages/*.deb output_packages/

      - name: Build Rootful Package (.deb)
        run: |
          make clean
          make package FINALPACKAGE=1
          cp packages/*.deb output_packages/

      - name: Upload Compiled .deb Packages
        uses: actions/upload-artifact@v4
        with:
          name: DriftDock-Deb-Packages
          path: output_packages/*.deb
