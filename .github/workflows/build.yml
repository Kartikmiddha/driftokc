name: Build DriftDock

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies (ldid & dpkg)
        run: |
          brew install ldid dpkg

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Download iOS SDK (Fast Sparse Checkout)
        run: |
          mkdir -p $THEOS/sdks
          mkdir -p temp_sdks && cd temp_sdks
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS16.5.sdk" >> .git/info/sparse-checkout
          git pull --depth=1 origin master
          mv iPhoneOS16.5.sdk $THEOS/sdks/
          cd ..
          rm -rf temp_sdks

      - name: Build Rootless Package (.deb)
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p output_packages
          cp packages/*.deb output_packages/

      - name: Build Rootful Package (.deb)
        run: |
          make clean
          make package FINALPACKAGE=1
          cp packages/*.deb output_packages/

      - name: Upload Compiled .deb Packages
        uses: actions/upload-artifact@v4
        with:
          name: DriftDock-Deb-Packages
          path: output_packages/*.deb
